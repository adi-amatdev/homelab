apiVersion: v1
kind: Service
metadata:
  name: d2m-test
  namespace: apps
spec:
  selector:
    app: d2m-test
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: d2m-test
  namespace: apps
spec:
  ingressClassName: traefik
  rules:
    - host: d2m-test.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: d2m-test
                port:
                  number: 80
