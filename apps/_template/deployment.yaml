apiVersion: apps/v1
kind: Deployment
metadata:
  name: <your-app>
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: <your-app>
  template:
    metadata:
      labels:
        app: <your-app>
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: <your-app>
          image: ghcr.io/adi-amatdev/<your-app>:latest
          ports:
            - containerPort: 80
