apiVersion: v1
kind: Service
metadata:
  name: <your-app>
  namespace: apps
spec:
  selector:
    app: <your-app>
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: <your-app>
  namespace: apps
spec:
  ingressClassName: traefik
  rules:
    - host: <your-app>.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: <your-app>
                port:
                  number: 80
