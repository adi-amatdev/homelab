apiVersion: apps/v1
kind: Deployment
metadata:
  name: <your-app>
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: <your-app>
  template:
    metadata:
      labels:
        app: <your-app>
    spec:
      containers:
        - name: <your-app>
          image: <upstream-image>:latest
          ports:
            - containerPort: <port>
