apiVersion: v1
kind: Service
metadata:
  name: <your-app>
  namespace: ai
spec:
  selector:
    app: <your-app>
  ports:
    - port: <port>
      targetPort: <port>
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: <your-app>
  namespace: ai
spec:
  ingressClassName: traefik
  rules:
    - host: <your-app>.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: <your-app>
                port:
                  number: <port>
