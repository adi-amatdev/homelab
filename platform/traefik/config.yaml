globalArguments:
  - "--global.sendanonymoususage=false"

additionalArguments:
  - "--serversTransport.insecureSkipVerify=true"

ports:
  web:
    port: 80
    exposedPort: 80
    protocol: TCP
  websecure:
    port: 443
    exposedPort: 443
    protocol: TCP

ingressRoute:
  dashboard:
    enabled: true
    entryPoints: ["web"]

service:
  type: LoadBalancer

logs:
  general:
    level: INFO

providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true
