# HTTP exposure on the tailnet/LAN (backward compatible)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blogs
  namespace: apps
spec:
  ingressClassName: traefik
  rules:
    - host: blogs.homelab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blogs
                port:
                  number: 3000
---
# Strips the /s3 prefix so minio (path-style S3) sees /blogs/<key>.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-s3-prefix
  namespace: apps
spec:
  stripPrefix:
    prefixes:
      - /s3
---
# PUBLIC (Tailscale Funnel) - https://dhridata.tail6a3e40.ts.net
# Only this entrypoint is funneled (443 -> 8080), so only these routes are public.
# Blog at /, public images at /s3/*, /admin intentionally has NO route -> 404.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: blogs-public
  namespace: apps
spec:
  entryPoints:
    - public
  routes:
    - match: Host(`dhridata.tail6a3e40.ts.net`) && PathPrefix(`/s3`)
      kind: Rule
      middlewares:
        - name: strip-s3-prefix
          namespace: apps
      services:
        - name: minio
          namespace: cloud
          port: 9000
    - match: Host(`dhridata.tail6a3e40.ts.net`) && !PathPrefix(`/admin`)
      kind: Rule
      services:
        - name: blogs
          port: 3000
---
# PRIVATE (Tailscale Serve on :8443 -> traefik "private" entrypoint) - tailnet only.
# Full access including /admin at https://dhridata.tail6a3e40.ts.net:8443/admin
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: blogs-private
  namespace: apps
spec:
  entryPoints:
    - private
  routes:
    - match: Host(`dhridata.tail6a3e40.ts.net`) && PathPrefix(`/admin`)
      kind: Rule
      services:
        - name: blogs
          port: 3000
    - match: Host(`dhridata.tail6a3e40.ts.net`) && PathPrefix(`/s3`)
      kind: Rule
      middlewares:
        - name: strip-s3-prefix
          namespace: apps
      services:
        - name: minio
          namespace: cloud
          port: 9000
