apiVersion: v1
kind: Service
metadata:
  name: blogs
  namespace: apps
spec:
  selector:
    app: blogs
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blogs
  namespace: apps
spec:
  ingressClassName: traefik
  rules:
    - host: blogs.homelab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blogs
                port:
                  number: 3000
