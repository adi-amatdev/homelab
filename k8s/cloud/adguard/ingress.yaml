# adguard exposure.
# Tailnet/LAN HTTP only (adguard.homelab). DNS binds 100.93.76.126:53.
# Never expose the admin UI publicly.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adguard
  namespace: cloud
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: adguard.homelab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adguard
                port:
                  number: 80
