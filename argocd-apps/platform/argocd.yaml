apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: infra
spec:
  project: default
  sources:
    - repoURL: https://github.com/adi-amatdev/homelab
      targetRevision: HEAD
      ref: values
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 7.8.23
      helm:
        valueFiles:
          - $values/platform/argocd/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
