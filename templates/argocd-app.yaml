apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: <your-app>
  namespace: infra
spec:
  project: default
  source:
    repoURL: https://github.com/adi-amatdev/homelab
    targetRevision: HEAD
    path: <apps|cloud|ai>/<your-app>  # match the top-level folder
  destination:
    server: https://kubernetes.default.svc
    namespace: <namespace>            # apps | cloud | ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
