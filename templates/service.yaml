apiVersion: v1
kind: Service
metadata:
  name: <your-app>
  namespace: <namespace>        # apps | cloud | ai
spec:
  selector:
    app: <your-app>
  ports:
    - port: <port>
      targetPort: <port>
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: <your-app>
  namespace: <namespace>        # apps | cloud | ai
  annotations:
    # REQUIRED: keep *.homelab routes off the public (funneled) entrypoint.
    # Without this, Traefik attaches the route to every entrypoint and the
    # service becomes reachable from the internet via Host-header spoofing.
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: <your-app>.homelab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: <your-app>
                port:
                  number: <port>
