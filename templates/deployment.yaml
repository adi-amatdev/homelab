apiVersion: apps/v1
kind: Deployment
metadata:
  name: <your-app>
  namespace: <namespace>        # apps | cloud | ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: <your-app>
  template:
    metadata:
      labels:
        app: <your-app>
    spec:
      # remove if using a public upstream image
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: <your-app>
          image: <image>:latest  # ghcr.io/<org>/<app>:latest — or upstream image
          ports:
            - containerPort: <port>
          # remove if no persistent storage needed
          volumeMounts:
            - name: data
              mountPath: /data
      # remove if no persistent storage needed
      volumes:
        - name: data
          hostPath:
            path: /home/aadi/store/<your-app>-data
            type: DirectoryOrCreate
